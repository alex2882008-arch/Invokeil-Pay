name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bun (fallback installer)
        run: npm i -g bun && bun install

      - name: Prisma generate
        run: bunx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: bunx eslint src --quiet
